<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Page not found</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <!-- Absolute from here down, deliberately: a 404 is served for NESTED wrong paths
       like /foo/bar, where relative hrefs would resolve to /foo/assets/... and the
       one page meant to survive a bad path would load unstyled. -->
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/home.css" />
  <style>
    /* home.css gives the home page a fixed grain overlay via body::after. That stays off
       here: the leaves accent below is the decoration on this page, and a single centred
       card carrying both reads as noise. */
    body::after { display: none; }

    body { display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 2rem; }

    /* The accent layers are position: fixed, so they paint above static content whichever
       order the DOM is in. The card is lifted onto its own layer the same way home.css
       lifts `main > section > .container`, so the motif passes behind the text rather
       than over it. */
    body > div:not(.accent) { position: relative; z-index: 1; }

    /* same titling face as the section numerals, so the 404 reads as part of the set */
    .code {
      font-family: var(--font-titling);
      font-weight: 400;
      font-size: clamp(5rem, 17vw, 10rem);
      line-height: 0.9;
      color: var(--cobalt);
    }
    .shell {
      display: inline-block;
      margin-top: 1.75rem;
      text-align: left;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      line-height: 1.95;
      color: var(--ink-soft);
    }
    .shell__cmd { color: var(--cobalt); }
    .shell__out { color: var(--muted); }

    h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 1.6rem 0 0.75rem; }
    p { color: var(--muted); max-width: 42ch; margin: 0 auto 2rem; }
    .btn {
      display: inline-block;
      background: var(--cobalt);
      color: #fff;
      padding: 0.8rem 1.6rem;
      border-radius: var(--r-pill);
      font-weight: 600;
      text-decoration: none;
    }
    .btn:hover { background: var(--cobalt-deep); }
  </style>
</head>
<body>
  <div class="accent" aria-hidden="true"><div class="accent__ink"></div><div class="accent__light"></div><div class="accent__rim accent__rim--ink"></div><div class="accent__rim accent__rim--light"></div></div>
  <div>
    <div class="code">404</div>
    <div class="shell">
      <span class="shell__cmd">$ cat /requested-page</span><br />
      <span class="shell__out">404: not found</span>
    </div>
    <h1>This page wandered off.</h1>
    <p>Looks like the thing you're after isn't here — but the rest of the site is.</p>
    <a class="btn" href="/">Back home</a>
  </div>
</body>
</html>
