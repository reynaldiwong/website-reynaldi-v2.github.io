<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Page not found</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 2rem; }
    .code { font-family: var(--font-mono); font-size: clamp(4rem, 14vw, 8rem); font-weight: 600; color: var(--cobalt); line-height: 1; }
    h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0.5rem 0 1rem; }
    p { color: var(--muted); max-width: 420px; margin: 0 auto 2rem; }
    .btn { background: var(--cobalt); color: #fff; padding: 0.8rem 1.6rem; border-radius: var(--r-pill); font-weight: 600; }
    .btn:hover { background: var(--cobalt-deep); }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>This page wandered off.</h1>
    <p>Looks like the thing you're after isn't here — but the rest of the site is.</p>
    <a class="btn" href="/">Back home</a>
  </div>
</body>
</html>
